server {
    listen 7000;
    server_name _;
    root /ros2_ws/src/fastbot_webapp;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }

    # Serve robot mesh/URDF files for ros3d.js 3D model rendering
    # Browser requests package://fastbot_description/... as /fastbot_description/...
    location /fastbot_description/ {
        alias /ros2_ws/install/fastbot_description/share/fastbot_description/;
    }
}
