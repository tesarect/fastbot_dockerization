# =============================================================================
# docker-compose.yaml  —  FastBot Simulation Stack
#
# Mapping mode (default):
#   docker-compose -f docker-compose.yaml up
#
# Navigation mode (default baked-in map):
#   SLAM_MODE=localization MAP_NAME=cozy_room docker-compose up
#
# Navigation mode (custom map from volume):
#   SLAM_MODE=localization MAP_NAME=my_map MAP_FILE=/maps/my_map.yaml \
#     docker-compose up
#
# Save map while cartographer is running:
#   docker exec -it fastbot-ros2-slam bash
#   ros2 run nav2_map_server map_saver_cli -f /maps/my_map
# =============================================================================

version: "3.7"

services:

  gazebo:
    image: ${DOCKERHUB_USER:-your_username}-cp22:fastbot-ros2-gazebo
    container_name: fastbot-ros2-gazebo
    networks:
      - ros2_network
    # network_mode: host
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=0
      - DISPLAY
      - RCUTILS_COLORIZED_OUTPUT=1
      - 'RCUTILS_CONSOLE_OUTPUT_FORMAT=[{severity}] [{time}] [{name}]: {message}'
    stdin_open: true
    tty: true
    command: ros2 launch fastbot_gazebo one_fastbot_room.launch.py

  slam:
    image: ${DOCKERHUB_USER:-your_username}-cp22:fastbot-ros2-slam
    container_name: fastbot-ros2-slam
    networks:
      - ros2_network
    # network_mode: host
    volumes:
      - fastbot_maps:/maps   # persists saved maps across runs
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=0
      - SLAM_MODE=${SLAM_MODE:-cartographer}
      - MAP_NAME=${MAP_NAME:-small_apartment}
      - MAP_FILE=${MAP_FILE:-}
      - RCUTILS_COLORIZED_OUTPUT=1
      - 'RCUTILS_CONSOLE_OUTPUT_FORMAT=[{severity}] [{time}] [{name}]: {message}'
    depends_on:
      - gazebo
    stdin_open: true
    tty: true
    command: /ros2_ws/start_slam.sh

  webapp:
    image: ${DOCKERHUB_USER:-your_username}-cp22:fastbot-ros2-webapp
    container_name: fastbot-ros2-webapp
    networks:
      - ros2_network
    ports:
      - "7000:7000"    # web panel  → http://localhost:7000
      - "9090:9090"    # rosbridge  → ws://localhost:9090
      - "11315:11315"  # camera     → http://localhost:11315
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=0
    depends_on:
      - slam
    stdin_open: true
    tty: true
    command: /ros2_ws/start_web_service.sh

networks:
  ros2_network:
    driver: bridge

volumes:
  fastbot_maps:   # named volume — persists maps across container restarts
    name: fastbot-maps