# =============================================================================
# map_poses.yaml
# Initial poses and waypoints for each available map.
#
# initial_pose: where the robot starts when localization launches
# waypoints:    named navigation goals (for future use with Nav2)
#
# Used by start_slam.sh to publish /initialpose when SLAM_MODE=localization
# =============================================================================

small_apartment:
  initial_pose:
    x: 1.650
    y: -2.927
    yaw: 3.078    # RPY radian z value (≈ 176° = facing backwards)
  waypoints:
    origin:
      x: 1.650
      y: -2.927
      yaw: 3.078

