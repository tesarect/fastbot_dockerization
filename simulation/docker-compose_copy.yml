# =============================================================================
# docker-compose.yaml  —  FastBot Simulation Stack
#
# Mapping (default):
#   docker-compose -f docker-compose.yaml up
#
# Navigation with baked-in map:
#   SLAM_MODE=localization MAP_NAME=cozy_room docker-compose up
#
# Navigation with custom saved map:
#   SLAM_MODE=localization MAP_NAME=my_map MAP_FILE=/maps/my_map.yaml \
#     docker-compose up
#
# Save map while cartographer running:
#   docker exec -it fastbot-ros2-slam bash
#   ros2 run nav2_map_server map_saver_cli -f /maps/my_map
# =============================================================================

version: "3.7"

services:

  gazebo:
    image: ${DOCKERHUB_USER:-your_username}-cp22:fastbot-ros2-gazebo
    container_name: fastbot-ros2-gazebo
    network_mode: host
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=0
      - DISPLAY
    stdin_open: true
    tty: true
    command: ros2 launch fastbot_gazebo one_fastbot_room.launch.py

  slam:
    image: ${DOCKERHUB_USER:-your_username}-cp22:fastbot-ros2-slam
    container_name: fastbot-ros2-slam
    network_mode: host
    volumes:
      - fastbot_maps:/maps
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=0
      - SLAM_MODE=${SLAM_MODE:-cartographer}
      - MAP_NAME=${MAP_NAME:-small_apartment}
      - MAP_FILE=${MAP_FILE:-}
    depends_on:
      - gazebo
    stdin_open: true
    tty: true
    command: /ros2_ws/start_slam.sh

  # webapp:
  #   image: ${DOCKERHUB_USER:-your_username}-cp22:fastbot-ros2-webapp
  #   container_name: fastbot-ros2-webapp
  #   network_mode: host
  #   environment:
  #     - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
  #     - ROS_DOMAIN_ID=0
  #   depends_on:
  #     - slam
  #   stdin_open: true
  #   tty: true
  #   command: /ros2_ws/start_web_services.sh

volumes:
  fastbot_maps:
    name: fastbot-maps