# =============================================================================
# docker-compose.prod.yaml  —  Production overrides for Linux
#
# Adds: X11 forwarding, healthchecks, restart policy, memory limits
#
# Usage:
#   docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d
# =============================================================================

version: "3.7"

services:

  gazebo:
    environment:
      - DISPLAY
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # memory: 4G
          memory: 6G
        reservations:
          # memory: 2G
          memory: 4G
    healthcheck:
      test: ["CMD", "bash", "-c", "ros2 topic list | grep -q /clock"]
      interval: 10s
      # timeout: 5s
      timeout: 15s
      retries: 3
      # start_period: 30s
      start_period: 120s

